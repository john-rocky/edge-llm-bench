name: data pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  cells-valid:
    name: matrix cell files validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_cells.py matrices/*.cells
      - name: regression matrices carry anchors
        run: python scripts/validate_cells.py --require-anchor matrices/release-regression-*.cells matrices/anchors.cells

  summary-fresh:
    name: results/summary matches the raw tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/build_summary.py
      - name: committed CSVs are current
        run: git diff --exit-code results/summary/

  leaderboard-check:
    # LEADERBOARD.md is a LOCAL artifact now (harness-only public framing —
    # the repo ships the harness + raw records, not cross-runtime standings),
    # so CI verifies it RENDERS from the shipped raw, not that a committed
    # copy is fresh.
    name: leaderboard renders from shipped raw
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/render_leaderboard.py
      - name: dashboard table renders from shipped raw (local surface, never committed)
        run: python scripts/render_dashboard.py --check
      - run: python scripts/test_render_rules.py
      - run: python scripts/test_import_native_benchmark.py

  android-driver-selftest:
    # fake-adb end-to-end: record shape, firstEver marker, witness stamping,
    # capture gate + quarantine + retry — no device needed
    name: android driver selftest (fake adb)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python android/bench/selftest.py
      - run: python android/bench/test_longctx1024.py
      - name: pinned LiteRT-LM Android binaries from the release asset (the README's lines; the DDP selftest checks them against android/engine-pins.json)
        run: |
          TAG=$(python3 -c 'import json; print(json.load(open("android/engine-pins.json"))["android_pins"]["litert-lm"])')
          mkdir -p "$RUNNER_TEMP/android-bin"
          curl -fL "https://github.com/john-rocky/edge-llm-bench/releases/download/android-litert-lm-$TAG/litert-lm-$TAG-android-arm64.tar.gz" \
            | tar xz -C "$RUNNER_TEMP/android-bin" && mv "$RUNNER_TEMP/android-bin/litert-lm-$TAG-android-arm64" "$RUNNER_TEMP/android-bin/$TAG"
      - name: DDP driver selftest (fake gcloud and a fake Device Run server; no device, no network beyond the asset above)
        run: BENCH_ANDROID_BIN_DIR="$RUNNER_TEMP/android-bin" python android/ddp/selftest.py
      - name: dashboard job device choice (fake adb, temp holds; no results/raw touched)
        run: python scripts/dashboard_job_selftest.py
      - name: session checker verdicts (synthetic campaign dirs in a temp dir; no device, network or git history)
        run: python scripts/session_check_selftest.py

  scripts-compile:
    name: every script parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile all python
        run: python -m py_compile scripts/*.py android/bench/*.py android/ddp/*.py bench
      - name: bash -n all shell scripts
        run: for f in scripts/*.sh android/scripts/*.sh android/ddp/*.sh ios/BenchmarkApp/scripts/*.sh; do bash -n "$f" || exit 1; done

  # NOTE: no Xcode build job — the app/tool require the iOS 27 / macOS 27 SDK
  # (Xcode 27 beta), which GitHub-hosted runners do not ship. Builds are
  # verified on owner hardware (docs/OPERATIONS.md).
